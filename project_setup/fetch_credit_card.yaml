dataset:
  name: fetch_credit_card
  source: UCI Default of Credit Card Clients Dataset (Taiwan)
  dimensions:
    total_rows: 30000
    total_columns: 24
    features_count: 23
    target_count: 1
  columns:
    - name: LIMIT_BAL
      type: Continuous
      role: Feature
      description: Amount of given credit in NT dollars (individual plus family supplementary credit)
    - name: SEX
      type: Binary
      role: Feature (Sensitive)
      description: Sex code
      valid_values:
        1: Male
        2: Female
    - name: EDUCATION
      type: Categorical
      role: Feature
      description: Educational level
      valid_values:
        1: Graduate school
        2: University
        3: High school
        4: Others
        5: Unknown
        6: Unknown
    - name: MARRIAGE
      type: Categorical
      role: Feature
      description: Marital status
      valid_values:
        1: Married
        2: Single
        3: Others
    - name: AGE
      type: Integer
      role: Feature (Sensitive)
      description: Age in years
    - name: PAY_0
      type: Categorical
      role: Feature
      description: Repayment status in September
      valid_values: "-2: No consumption, -1: Paid in full, 0: The use of revolving credit, 1: Payment delay for one month, ..., 9: Payment delay for nine months and above"
    - name: PAY_2
      type: Categorical
      role: Feature
      description: Repayment status in August
      valid_values: Same scale as PAY_0
    - name: PAY_3
      type: Categorical
      role: Feature
      description: Repayment status in July
      valid_values: Same scale as PAY_0
    - name: PAY_4
      type: Categorical
      role: Feature
      description: Repayment status in June
      valid_values: Same scale as PAY_0
    - name: PAY_5
      type: Categorical
      role: Feature
      description: Repayment status in May
      valid_values: Same scale as PAY_0
    - name: PAY_6
      type: Categorical
      role: Feature
      description: Repayment status in April
      valid_values: Same scale as PAY_0
    - name: BILL_AMT1
      type: Continuous
      role: Feature
      description: Amount of bill statement in September (NT dollar)
    - name: BILL_AMT2
      type: Continuous
      role: Feature
      description: Amount of bill statement in August (NT dollar)
    - name: BILL_AMT3
      type: Continuous
      role: Feature
      description: Amount of bill statement in July (NT dollar)
    - name: BILL_AMT4
      type: Continuous
      role: Feature
      description: Amount of bill statement in June (NT dollar)
    - name: BILL_AMT5
      type: Continuous
      role: Feature
      description: Amount of bill statement in May (NT dollar)
    - name: BILL_AMT6
      type: Continuous
      role: Feature
      description: Amount of bill statement in April (NT dollar)
    - name: PAY_AMT1
      type: Continuous
      role: Feature
      description: Amount of previous payment in September (NT dollar)
    - name: PAY_AMT2
      type: Continuous
      role: Feature
      description: Amount of previous payment in August (NT dollar)
    - name: PAY_AMT3
      type: Continuous
      role: Feature
      description: Amount of previous payment in July (NT dollar)
    - name: PAY_AMT4
      type: Continuous
      role: Feature
      description: Amount of previous payment in June (NT dollar)
    - name: PAY_AMT5
      type: Continuous
      role: Feature
      description: Amount of previous payment in May (NT dollar)
    - name: PAY_AMT6
      type: Continuous
      role: Feature
      description: Amount of previous payment in April (NT dollar)
    - name: default_payment_next_month
      type: Binary
      role: Target Label
      description: Default payment next month
      valid_values:
        0: No default
        1: Defaulted