dataset:
  name: fetch_acs_income
  source: US Census Bureau (American Community Survey via Folktables)
  dimensions:
    total_rows: 1664500
    total_columns: 11
    features_count: 10
    target_count: 1
  columns:
    - name: AGEP
      type: Integer
      role: Feature (Sensitive)
      description: Age of the individual
      valid_values: 0-99
    - name: COW
      type: Categorical
      role: Feature
      description: Class of Worker
      valid_values:
        1: Private for-profit company
        2: Private non-profit organization
        3: Local government employee
        4: State government employee
        5: Federal government employee
        6: Self-employed in own not incorporated business
        7: Self-employed in own incorporated business
        8: Working without pay in family business or farm
    - name: SCHL
      type: Categorical
      role: Feature
      description: Educational attainment
      valid_values: "1 to 24 (e.g., 1: No schooling, 16: HS diploma, 21: Bachelor's, 22: Master's, 24: Doctorate)"
    - name: MAR
      type: Categorical
      role: Feature
      description: Marital status
      valid_values:
        1: Married
        2: Widowed
        3: Divorced
        4: Separated
        5: Never married
    - name: OCCP
      type: Categorical
      role: Feature
      description: Occupation recode
      valid_values: Standardized 4-digit US Census occupation codes
    - name: POBP
      type: Categorical
      role: Feature
      description: Place of birth
      valid_values: State or foreign country code
    - name: RELP
      type: Categorical
      role: Feature
      description: Relationship to householder
      valid_values: "0: Reference person, 1: Spouse, 2: Child, ..., 17: Roommate/Boarder"
    - name: WKHP
      type: Integer
      role: Feature
      description: Usual hours worked per week over past 12 months
      valid_values: 1-99
    - name: SEX
      type: Binary
      role: Feature (Sensitive)
      description: Sex code
      valid_values:
        1: Male
        2: Female
    - name: RAC1P
      type: Categorical
      role: Feature (Sensitive)
      description: Recoded detailed race code
      valid_values: "1: White, 2: Black/African American, 3: American Indian, 6: Asian, etc."
    - name: PINCP
      type: Continuous
      role: Target Label
      description: Total annual person's income
      valid_values: Raw USD amount (often thresholded at >50000 for classification tasks)